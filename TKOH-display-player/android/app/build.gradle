plugins {
  id 'com.android.application'
}

android {
  namespace 'hk.org.ha.tkoh.displayplayer'
  compileSdk 34

  defaultConfig {
    applicationId 'hk.org.ha.tkoh.displayplayer'
    minSdk 23
    targetSdk 34
    versionCode 12
    versionName '1.0.12'
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
      outputFileName = "TKOH Display Player Setup ${variant.versionName}.apk"
    }
  }
  
  // 关闭 Release 打包的 Lint 检查
  lint {
    abortOnError false
    checkReleaseBuilds false
  }

  // 打包指令
  println "==== Keystore Path Debug ===="
  def ksFile = file("../release_jks/tkho_display_player")
  println "Absolute Path: " + ksFile.absolutePath
  println "Exists? " + ksFile.exists()

  signingConfigs {
    release {
      keyAlias 'displaykey'
      keyPassword '123456'
      storeFile file("../release_jks/tkho_display_player")
      storePassword '123456'
    }
  }
  buildTypes {
    release {
      minifyEnabled = false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }
  }
}

dependencies {
  // No AppCompat: avoids Kotlin stdlib duplicate-class conflicts for this WebView shell.
}

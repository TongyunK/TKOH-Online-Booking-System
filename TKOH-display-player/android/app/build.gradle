plugins {
  id 'com.android.application'
}

android {
  namespace 'hk.org.ha.tkoh.displayplayer'
  compileSdk 34

  defaultConfig {
    applicationId 'hk.org.ha.tkoh.displayplayer'
    minSdk 24
    targetSdk 34
    versionCode 2
    versionName '1.0.1'
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // No AppCompat: avoids Kotlin stdlib duplicate-class conflicts for this WebView shell.
}

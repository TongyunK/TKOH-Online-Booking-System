<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Settings</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: auto;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0b1220;
        color: #e2e8f0;
      }

      .shell {
        height: 100%;
        box-sizing: border-box;
        padding: 20px 24px 24px;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(circle at top right, rgba(34, 197, 94, 0.12), transparent 42%),
          linear-gradient(180deg, #111827 0%, #0b1220 100%);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-shrink: 0;
      }

      .badge {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #22c55e, #15803d);
        color: #fff;
        font-weight: 800;
        font-size: 0.85rem;
        box-shadow: 0 8px 18px rgba(22, 163, 74, 0.28);
        flex-shrink: 0;
      }

      .titles h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      .titles p {
        margin: 2px 0 0;
        color: #94a3b8;
        font-size: 0.8rem;
      }

      .field {
        margin-bottom: 10px;
        flex-shrink: 0;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: #cbd5e1;
        font-size: 0.82rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border: 1px solid #334155;
        border-radius: 10px;
        background: #ffffff;
        color: #0f172a;
        font-size: 0.95rem;
        outline: none;
      }

      input:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
      }

      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 12px;
        flex-shrink: 0;
      }

      .preset {
        min-width: 0;
        padding: 7px 12px;
        border: 1px solid #334155;
        border-radius: 999px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 0.78rem;
        font-weight: 650;
        cursor: pointer;
      }

      .preset:hover {
        background: #334155;
      }

      .preset.active {
        background: #166534;
        border-color: #22c55e;
        color: #fff;
      }

      .hint {
        margin: 0 0 12px;
        color: #94a3b8;
        font-size: 0.78rem;
        line-height: 1.35;
        flex-shrink: 0;
      }

      .actions {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .actions-right {
        display: flex;
        gap: 10px;
      }

      .actions button {
        min-width: 96px;
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        font-size: 0.92rem;
        font-weight: 650;
        cursor: pointer;
      }

      .exit {
        background: #dc2626;
        color: #fff;
      }

      .exit:hover {
        background: #b91c1c;
      }

      .cancel {
        background: #1e293b;
        color: #e2e8f0;
      }

      .cancel:hover {
        background: #334155;
      }

      .save {
        background: #16a34a;
        color: #fff;
      }

      .save:hover {
        background: #15803d;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="header">
        <div class="badge">TK</div>
        <div class="titles">
          <h1>Display Settings</h1>
          <p>Configure this device's display URL</p>
        </div>
      </div>

      <div class="field">
        <label for="link">Link</label>
        <input id="link" type="url" spellcheck="false" />
      </div>

      <div class="presets" id="presets"></div>

      <div class="field">
        <label for="reloadHours">Reload hours (0 = off; recommend 12–24 for 24h kiosk)</label>
        <input id="reloadHours" type="number" min="0" step="1" />
      </div>

      <p class="hint">
        For 24h displays: keep Reload hours at 12–24 (soft memory recycle). 0 is not recommended.
        After a server frontend update, use <strong>Force refresh</strong> if the page looks stale
        (no reinstall needed).
      </p>

      <div class="actions">
        <button class="exit" type="button" id="exit">Exit</button>
        <div class="actions-right">
          <button class="cancel" type="button" id="cancel">Cancel</button>
          <button class="cancel" type="button" id="forceRefresh" title="Bust HTTP cache and reload">Force refresh</button>
          <button class="save" type="button" id="save">Save</button>
        </div>
      </div>
    </div>

    <script>
      const DEFAULT_ORIGIN = 'http://103.68.62.241:3200'
      const PRESETS = [
        { label: 'Discussion Room', path: '/VenueBooking/Display?displayType=single&venueId=4' },
        { label: 'Function Room', path: '/VenueBooking/Display?displayType=single&venueId=5' },
        { label: 'Lecture Theatre', path: '/VenueBooking/Display?displayType=single&venueId=6' },
        { label: 'Auditorium', path: '/VenueBooking/Display?displayType=single&venueId=7' },
        { label: 'Tea Service', path: '/VenueBooking/Display/TeaService' },
        { label: 'Venue Merge Screen', path: '/VenueBooking/Display/Merge' },
        { label: 'EV Display', path: '/evBooking/Display' }
      ]

      const linkInput = document.getElementById('link')
      const presetsEl = document.getElementById('presets')

      function originFromLink (link) {
        try {
          return new URL(String(link || '').trim()).origin
        } catch {
          return DEFAULT_ORIGIN
        }
      }

      function presetUrl (preset) {
        return originFromLink(linkInput.value) + preset.path
      }

      function normalize (url) {
        return String(url || '').trim().replace(/\/+$/, '').toLowerCase()
      }

      function markActive () {
        const current = normalize(linkInput.value)
        presetsEl.querySelectorAll('.preset').forEach((btn, index) => {
          const url = normalize(presetUrl(PRESETS[index]))
          const path = PRESETS[index].path.toLowerCase()
          btn.classList.toggle('active', current.includes(path))
        })
      }

      PRESETS.forEach((preset) => {
        const btn = document.createElement('button')
        btn.type = 'button'
        btn.className = 'preset'
        btn.textContent = preset.label
        btn.addEventListener('click', () => {
          linkInput.value = presetUrl(preset)
          markActive()
          linkInput.focus()
        })
        presetsEl.appendChild(btn)
      })

      linkInput.addEventListener('input', markActive)

      async function init () {
        const config = await window.tkohSettings.getConfig()
        linkInput.value = config.link || ''
        document.getElementById('reloadHours').value = config.reloadHours ?? 12
        markActive()
      }

      document.getElementById('cancel').addEventListener('click', () => {
        window.tkohSettings.close()
      })

      document.getElementById('exit').addEventListener('click', () => {
        window.tkohSettings.quitApp()
      })

      async function saveConfig (link) {
        const reloadHours = Number(document.getElementById('reloadHours').value)
        if (!link) {
          alert('Link is required')
          return
        }
        if (!Number.isFinite(reloadHours) || reloadHours < 0) {
          alert('Reload hours must be a number >= 0')
          return
        }
        await window.tkohSettings.saveConfig({ link, reloadHours })
      }

      document.getElementById('save').addEventListener('click', async () => {
        await saveConfig(linkInput.value.trim())
      })

      /** 不重装 EXE：改 link 的 _v 查询参数即可让 Chromium 放弃旧缓存文档 */
      document.getElementById('forceRefresh').addEventListener('click', async () => {
        const raw = linkInput.value.trim()
        if (!raw) {
          alert('Link is required')
          return
        }
        try {
          const url = new URL(raw)
          url.searchParams.set('_v', String(Date.now()))
          linkInput.value = url.toString()
          await saveConfig(linkInput.value.trim())
        } catch {
          alert('Link must be a valid URL')
        }
      })

      init()
    </script>
  </body>
</html>

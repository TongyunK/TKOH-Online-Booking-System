<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #001e5c;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .box {
        text-align: center;
      }
      .title {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 0.4rem;
      }
      .sub {
        color: #94a3b8;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="title">Room Display Player Demo</div>
      <div class="sub" id="sub">Loading display…</div>
    </div>
    <script>
      try {
        var msg = new URLSearchParams(location.search).get('msg')
        if (msg) document.getElementById('sub').textContent = msg
      } catch (e) {}
    </script>
  </body>
</html>

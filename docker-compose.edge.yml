# 兼容入口：实际配置在 ./acme-edge/
# 推荐独立部署：cp -a acme-edge ~/acme-edge && cd ~/acme-edge && docker compose up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  acme-edge:
    image: nginx:alpine
    container_name: acme-edge
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./acme-edge/edge.conf:/etc/nginx/nginx.conf:ro
      - ./acme-edge/acme-webroot:/var/www/acme:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

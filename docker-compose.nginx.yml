# Nginx 入口（蓝绿流量切换）

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: tkho-booking-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3200:80"
      - "3243:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 优先挂载整机共用证书目录（acme-edge/ssl）；未设置时用项目内 ssl
      # 例：在 .env 或环境中设置
      #   ACME_SSL_DIR=/home/proj_deploy/Documents/acme-edge/ssl
      - ${ACME_SSL_DIR:-./docker/nginx/ssl}:/etc/nginx/ssl:ro
    networks:
      - tkho-booking-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

networks:
  tkho-booking-network:
    external: true

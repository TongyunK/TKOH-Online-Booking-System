# 仅用于 Let's Encrypt HTTP-01（webroot）。
# 不反代任何业务系统：业务仍通过各自端口访问（订房 3200/3243、其他系统自有端口）。
worker_processes auto;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        server_name _;

        # Certbot webroot: http://<IP>/.well-known/acme-challenge/<token>
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }

        # 明确不提供订房或其他业务入口
        location / {
            default_type text/plain;
            return 404 "ACME edge only. Use system-specific ports (e.g. :3243 for TKOH booking).\n";
        }
    }
}
